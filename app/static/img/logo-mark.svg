<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#234A37"/>
      <stop offset="100%" stop-color="#16301F"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="200" height="200" rx="46"/>
    </clipPath>
    <clipPath id="weaveCircle">
      <circle cx="100" cy="100" r="62"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect x="0" y="0" width="200" height="200" fill="url(#bg)"/>

    <!-- woven mat motif: two perpendicular sets of diagonal strands, clipped to a circle -->
    <g clip-path="url(#weaveCircle)">
      <!-- strand set A: kowhai gold, 45deg -->
      <g stroke="#E3A730" stroke-width="13" stroke-linecap="round">
        <line x1="20"  y1="180" x2="180" y2="20"/>
        <line x1="4"   y1="146" x2="146" y2="4"/>
        <line x1="54"  y1="196" x2="196" y2="54"/>
        <line x1="-14" y1="112" x2="112" y2="-14"/>
        <line x1="88"  y1="212" x2="212" y2="88"/>
      </g>
      <!-- strand set B: soft cream, -45deg -->
      <g stroke="#F4EBD6" stroke-width="13" stroke-linecap="round" opacity="0.92">
        <line x1="20"  y1="20"  x2="180" y2="180"/>
        <line x1="4"   y1="54"  x2="146" y2="196"/>
        <line x1="54"  y1="4"   x2="196" y2="146"/>
        <line x1="-14" y1="88"  x2="112" y2="214"/>
        <line x1="88"  y1="-14" x2="212" y2="112"/>
      </g>
    </g>

    <!-- thin ring framing the weave -->
    <circle cx="100" cy="100" r="62" fill="none" stroke="#F4EBD6" stroke-width="2.5" opacity="0.55"/>
  </g>
</svg>
